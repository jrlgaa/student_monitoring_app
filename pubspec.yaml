name: project
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  file_picker: ^10.3.10
  shared_preferences: ^2.3.2
  sqflite: ^2.3.0
  path: ^1.9.0
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1   # ✅ ADDED

flutter:
  uses-material-design: true

  assets:
    - lib/assets/Logo_app.png   # ✅ OPTIONAL but recommended

# ✅ MUST BE OUTSIDE "flutter"
flutter_icons:
  android: true
  ios: true
  image_path: "lib/assets/Logo_app.png"